[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordcut-core"
version = "0.1.0"
description = "Domínio do Wordcut: pregação, transcrição, edição e corte vertical."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python-headless>=4.10,<5",
    "pillow>=12.3.0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
asr = ["whisperx>=3.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/wordcut"]
