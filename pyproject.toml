[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordcut"
version = "0.1.0"
description = "Corta pregações de cultos e gera cortes verticais editados palavra a palavra."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python-headless>=4.10,<5",
    "pillow>=12.3.0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
asr = ["whisperx>=3.4"]

[project.scripts]
wordcut = "wordcut.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy-stubs>=1.15.3.0",
    "types-pillow>=10.2.0.20240822",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# en dash is intentional in Portuguese user-facing text
allowed-confusables = ["–"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["whisperx", "whisperx.*", "torch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
