[tool.uv.workspace]
members = ["packages/core", "apps/cli", "apps/api"]

[tool.uv.sources]
wordcut-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy-stubs>=1.15.3.0",
    "types-pillow>=10.2.0.20240822",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["packages/core/src", "apps/cli/src", "apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# en dash is intentional in Portuguese user-facing text
allowed-confusables = ["–"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["packages/core/src", "apps/cli/src", "apps/api/src"]

[[tool.mypy.overrides]]
module = ["whisperx", "whisperx.*", "torch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/cli/tests", "apps/api/tests"]
addopts = ["--import-mode=importlib"]
