<title>Word Cuts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Open+Sans:wght@700&family=Montserrat:wght@800&family=Poppins:wght@700&family=Roboto+Slab:wght@700&family=Bebas+Neue&family=Anton&display=swap">
<style>
/* Layout de editor: barra de ícones e painel à esquerda; prévia, transporte e timeline sempre visíveis. */
:root {
  color-scheme: dark;
  --bg: #0d0e10;
  --panel: #141619;
  --raised: #1b1e22;
  --hover: #23272c;
  --line: #262a2f;
  --line-2: #343940;
  --fg: #e6e7e9;
  --muted: #8b9198;
  --faint: #5b6168;
  --accent: #ffd600;
  --on-accent: #141414;
  --ok: #4cc38a;
  --warn: #f0a43a;
  --danger: #f2555a;
  --font-ui: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-cap: "Open Sans", "Helvetica Neue", Arial, sans-serif;
  --r: 8px;
  --tl-head: 132px;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.app.settings { grid-template-rows: minmax(0, 1fr) auto; }

/* Barra de status no rodapé, sempre visível */
.sbar { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(6px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--bg); font-size: 12px; color: var(--muted); min-width: 0; white-space: nowrap; }
.sb-i { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--fg); padding: 3px 6px; border-radius: 5px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 12px; }
.sb-i:hover { background: var(--raised); }
.sb-prog { width: 90px; height: 4px; border-radius: 2px; background: var(--raised); overflow: hidden; flex: none; }
.sb-prog i { display: block; height: 100%; background: var(--accent); }
.segctl.sm { padding: 1px; }
.segctl.sm button { padding: 1px 8px; font-size: 11.5px; }
.dot.busy { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }

/* Configurações: tela inteira com navegação lateral própria */
.settings-screen { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
.snav { border-right: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
.sn-back { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); font-size: 14px; cursor: pointer; text-align: left; }
.sn-back:hover { background: var(--raised); }
.sn-back svg { width: 18px; height: 18px; }
.sn-search { position: relative; padding: 12px; }
.sn-search svg { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); }
.sn-search .input { padding-left: 36px; }
.sn-list { overflow: auto; padding: 0 10px 16px; display: grid; align-content: start; gap: 1px; }
.sn-g { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 16px 10px 6px; }
.sn-i { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; text-align: left; font-size: 14px; }
.sn-i:hover, .sn-i[aria-current="true"] { background: var(--raised); color: var(--fg); }
.sn-i svg { width: 18px; height: 18px; flex: none; }
.sn-i .rl { margin-left: auto; color: var(--faint); display: inline-flex; }
.smain { overflow: auto; min-height: 0; }
.s-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 32px; border-bottom: 1px solid var(--line); background: var(--bg); }
.s-top .sl { font-weight: 500; }
.s-wrap { max-width: 880px; margin: 0 auto; padding: 40px 32px 64px; }
.s-head { display: flex; align-items: center; gap: 12px; }
.s-head h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.s-head { padding-bottom: 20px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.ssec { padding-top: 32px; }
.ssec > h2 { margin: 0 0 14px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.sgrp { position: relative; }
.sgrp > .s-top { margin: 24px -32px 0; }
.s-saved { position: fixed; top: 18px; right: 28px; z-index: 5; }
.scard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px 10px; margin-bottom: 16px; }
.scard > h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.scard > .note { margin-bottom: 6px; }
.scard .note b { color: var(--fg); font-weight: 500; }

/* Barra superior */
.top { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
.brand b { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); }
.crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
.cr { background: none; border: 0; padding: 4px 6px; border-radius: 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; font-size: 13.5px; }
button.cr { cursor: pointer; }
button.cr:hover { background: var(--raised); color: var(--fg); }
.cr.cur { color: var(--fg); }
.crsep { color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.pill.busy .dot { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.segctl { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; flex: none; }
.segctl button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.segctl button[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
.segctl.lg button { padding: 5px 10px; font-size: 13px; }
.label-sm { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.exp { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); width: 310px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; box-shadow: 0 14px 36px rgba(0,0,0,.55); z-index: 30; display: grid; gap: 2px; }
.mi { display: grid; gap: 1px; text-align: left; padding: 8px 10px; border-radius: 7px; border: 0; background: none; cursor: pointer; }
.mi:hover:not(:disabled) { background: var(--hover); }
.mi b { font-weight: 500; font-size: 13.5px; }
.mi small { color: var(--muted); font-size: 12px; }
.mi:disabled { opacity: .45; cursor: not-allowed; }
.msep { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 10px 10px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
.mnote { margin: 2px 10px 4px; color: var(--warn); font-size: 12px; }

/* Estrutura */
.shell { display: grid; grid-template-columns: auto minmax(0, 1fr); min-height: 0; }
.side { width: 340px; min-width: 0; border-right: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; container: side / inline-size; }
.side.wide { width: min(540px, 44vw); }
.side-h { display: flex; align-items: flex-start; gap: 8px; padding: 14px 10px 10px 16px; }
.side-h h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
.side-h .note { margin-top: 2px; }
.side-b { overflow: auto; padding: 4px 16px 16px; display: grid; gap: 12px; align-content: start; min-height: 0; }
.side-b > * { min-width: 0; }
.work { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; }

/* Palco */
.stage { position: relative; min-height: 0; display: grid; padding: 14px 20px; background: radial-gradient(ellipse at 50% 45%, #15171a 0%, #08090a 75%); }
.vp { position: relative; min-height: 0; min-width: 0; container-type: size; display: grid; place-items: center; }
.frame { position: relative; container-type: inline-size; border-radius: 4px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line-2), 0 18px 40px rgba(0,0,0,.5); }
.frame canvas { display: block; width: 100%; height: 100%; }
.frame.h { width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; }
.frame.v { height: min(100cqh, calc(100cqw * 16 / 9)); aspect-ratio: 9 / 16; }
.caption { position: absolute; left: 6%; right: 6%; top: 50%; transform: translateY(-50%); text-align: center; font: 700 6.4cqw/1.18 var(--font-cap); color: #ffd600;
  -webkit-text-stroke: .5cqw #000; paint-order: stroke fill; text-shadow: 0 .6cqw 1.4cqw rgba(0,0,0,.75); text-wrap: balance; }
.caption { pointer-events: none; }
.caption .cw, .caption .cw-in { pointer-events: auto; }
.caption .cw { cursor: text; border-radius: .25em; user-select: none; }
.caption .cw:hover { background: rgba(255,214,0,.16); }
.caption .cw-in { font: inherit; color: inherit; -webkit-text-stroke: inherit; paint-order: inherit; text-shadow: inherit; text-align: center; background: rgba(0,0,0,.55); border: 2px solid var(--accent); border-radius: .2em; padding: 0 .15em; outline: none; min-width: 2ch; }
.caption[hidden] { display: none; }
.sw { width: 22px; height: 22px; border-radius: 50%; background: var(--sw); border: 2px solid var(--line-2); cursor: pointer; padding: 0; flex: none; }
.sw[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
input[type="color"].pick { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line-2); border-radius: 6px; background: none; cursor: pointer; }
input[type="range"].rng { width: 130px; accent-color: var(--accent); }
.clip.cap.off { opacity: .3; }
/* Formulário da legenda: rótulo à esquerda, controle à direita, em linhas compactas */
.lform h3 { margin-bottom: 4px; }
.lrow { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 12px; min-height: 40px; padding: 4px 0; }
.lrow .sl { font-size: 13px; font-weight: 500; color: var(--fg); }
.lrow .ctl { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; }
.lrow .ctl select.input { width: 100%; max-width: 200px; }
.lrow input[type="range"].rng { flex: 1; min-width: 0; max-width: 140px; }
.lrow .lval { min-width: 44px; text-align: right; font-size: 12px; }
.lrow .sw { width: 20px; height: 20px; }
.croprect { position: absolute; top: 0; bottom: 0; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgba(0,0,0,.5); border-radius: 2px; pointer-events: none; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); }
.ov-card { background: var(--raised); border: 1px solid var(--line-2); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; width: min(320px, 84%); font-size: 13px; }
.empty-stage { place-self: center; display: grid; justify-items: center; gap: 12px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 32px 28px; max-width: 420px; }
.empty-stage > svg { width: 28px; height: 28px; }
.empty-stage p { margin: 0; }

/* Transporte e ferramentas */
.transport { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--bg); }
.tools { display: flex; align-items: center; gap: 2px; min-width: 0; flex-wrap: wrap; }
.tools.c { gap: 4px; flex-wrap: nowrap; }
.tools.r { justify-content: flex-end; flex-wrap: nowrap; }
.tsep { width: 1px; height: 20px; background: var(--line-2); margin: 0 6px; }
.ibtn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; flex: none; padding: 0; }
.ibtn:hover:not(:disabled) { background: var(--raised); color: var(--fg); }
.ibtn:disabled { opacity: .35; cursor: not-allowed; }
.ibtn[aria-pressed="true"] { color: var(--accent); }
.ibtn svg { width: 18px; height: 18px; }
.ibtn.sm { width: 28px; height: 28px; }
.ibtn.sm svg { width: 16px; height: 16px; }
.play { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; display: grid; place-items: center; flex: none; margin: 0 2px; }
.play:disabled { opacity: .35; cursor: not-allowed; }
.play svg { width: 12px; height: 12px; }
.tc { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; margin-left: 6px; }
.tc b { color: var(--fg); font-weight: 500; }

/* Timeline */
.tl { position: relative; display: grid; grid-template-columns: var(--tl-head) minmax(0, 1fr); border-top: 1px solid var(--line); background: var(--panel); user-select: none; }
.tl-heads { border-right: 1px solid var(--line); }
.th { display: flex; align-items: center; gap: 7px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.th > svg { width: 15px; height: 15px; flex: none; }
.th .hl { color: var(--faint); display: inline-flex; }
.tl-scroll { overflow-x: auto; overflow-y: hidden; min-width: 0; scrollbar-color: var(--line-2) transparent; }
.tl-content { position: relative; min-width: 100%; }
.lane { position: relative; border-bottom: 1px solid var(--line); cursor: pointer; }
.lane.ruler { background: var(--bg); }
.tick { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--line-2); }
.tick.major { height: 9px; background: var(--faint); }
.tick span { position: absolute; bottom: 10px; left: 4px; font: 10.5px var(--font-mono); color: var(--faint); white-space: nowrap; }
.clip { position: absolute; top: 5px; bottom: 5px; min-width: 3px; border-radius: 6px; border: 1.5px solid transparent; overflow: hidden; display: flex; align-items: flex-end; font-size: 11px; }
.clip .lbl { margin: 3px; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.66); color: #e8ebff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 6px); }
.clip.vid { background-color: #1d2440; background-size: 100% 100%; border-color: #4d60b0; }
.clip.vid.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.clip[draggable="true"] { cursor: grab; }
.clip.drop { outline: 2px dashed var(--accent); outline-offset: 1px; }
.clip.aud { background-color: #18203a; background-size: 100% 100%; border-color: #34437d; }
.clip.cap { background: color-mix(in srgb, var(--accent) 15%, var(--panel)); border-color: color-mix(in srgb, var(--accent) 50%, transparent); align-items: center; color: #ffe680; padding: 0 6px; }
.clip.cap span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clip.cap.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 30%, var(--panel)); }
.clip.rot { overflow: visible; background: color-mix(in srgb, var(--c) 32%, var(--panel)); border-color: var(--c); align-items: center; }
.clip.rot .lbl { background: none; color: var(--fg); text-shadow: 0 1px 2px #000, 0 0 6px #000; margin-left: 8px; max-width: none; overflow: visible; }
.clip.rot.off { opacity: .35; }
.clip.ghost { opacity: .22; filter: grayscale(.6); border-color: transparent; pointer-events: none; }
.clip.trimclip { overflow: visible; border-color: #4d60b0; }
.clip.trimclip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.clip.trimclip .lbl { margin-left: 14px; }
.trim { position: absolute; top: -1.5px; bottom: -1.5px; width: 12px; background: var(--accent); cursor: ew-resize; z-index: 2; display: grid; place-items: center; touch-action: none; }
.trim::after { content: ""; width: 2px; height: 40%; border-radius: 1px; background: #1a1a1a; }
.trim.l { left: -1.5px; border-radius: 6px 0 0 6px; }
.trim.r { right: -1.5px; border-radius: 0 6px 6px 0; }
.trim:hover, .trimming .trim { filter: brightness(1.1); }
.rnum { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 5px; background: var(--c); color: #111; font: 600 11px var(--font-mono); font-style: normal; flex: none; }
.clip.rot .lbl { margin-left: 6px; padding: 0; text-shadow: none; }
.clip.rot.sel { box-shadow: 0 0 0 2px var(--c); }
.clip.rng { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); align-items: center; }
.clip.rng .lbl { background: none; color: var(--accent); font-weight: 600; }
.zone { position: absolute; top: 0; bottom: 0; pointer-events: none; background: repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 6px, transparent 6px 12px); }
.zone span { position: absolute; top: 4px; left: 6px; font-size: 10.5px; color: #cfd3d8; background: rgba(0,0,0,.6); padding: 0 5px; border-radius: 3px; white-space: nowrap; }
.hes { position: absolute; top: 3px; bottom: 3px; width: 2px; background: var(--danger); border-radius: 1px; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); pointer-events: none; z-index: 5; }
.playhead::before { content: ""; position: absolute; top: 0; left: -5px; width: 12px; height: 12px; background: var(--fg); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.lane-hint { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 10px; color: var(--faint); font-size: 12px; pointer-events: none; }
.tl-empty { position: absolute; inset: 26px 0 0; display: grid; place-items: center; color: var(--faint); font-size: 12.5px; pointer-events: none; }

/* Componentes do painel */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--raised); cursor: pointer; white-space: nowrap; }
.btn svg { width: 16px; height: 16px; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--fg); background: var(--raised); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--raised); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; flex: none; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
.chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.chip.off { color: var(--faint); }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; color: var(--muted); }
.input { background: var(--bg); border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 10px; width: 100%; min-width: 0; }
textarea.input { resize: vertical; line-height: 1.5; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); font-size: 13px; }
.banner.err { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); background: color-mix(in srgb, var(--danger) 8%, var(--panel)); }
.banner strong { font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }

document.addEventListener("keydown", e => {

/* Arrastos na timeline: bordas da pregação e faixa de cada corte (só o admin move ou redimensiona) */
let drag = null;
function setLegendTab(on) {

document.addEventListener("pointermove", e => {
  if (!drag) return;
  const s = sermon(), D = s.liveDur, pc = x => x / D * 100;
  if (drag.kind === "sermon") {
    const { lo, hi } = bounds(s); let t = Math.round(Math.min(Math.max(0, (e.clientX - drag.rect.left) / drag.rect.width * D), D));
    if (drag.side === "in") { t = Math.min(t, hi - MINLEN); s.range = [t, hi]; } else { t = Math.max(t, lo + MINLEN); s.range = [lo, t]; }
    const b = bounds(s);
    ["trimv", "trima"].forEach(id => { const el = document.getElementById(id); if (!el) return; el.style.left = pc(b.lo) + "%"; el.style.width = pc(b.hi - b.lo) + "%";
      el.style.backgroundSize = `${D / (b.hi - b.lo) * 100}% 100%`; el.style.backgroundPosition = `${b.lo / (D - (b.hi - b.lo) || 1) * 100}% 0`; });
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set("trimlbl", `Pregação · ${fmt(b.hi - b.lo)}`); set("kvin", fmt(b.lo)); set("kvout", fmt(b.hi)); set("kvlen", fmt(b.hi - b.lo));
    document.getElementById("trimv")?.classList.add("on");

  let a = a0, b = b0;
  if (drag.mode === "move") { const d = Math.min(Math.max(dt, minA - a0), maxB - b0); a = a0 + d; b = b0 + d; }
  if (drag.mode === "l") a = Math.min(Math.max(minA, a0 + dt), b0 - 10);
  if (drag.mode === "r") b = Math.max(Math.min(maxB, b0 + dt), a0 + 10);

});

let dragFrom = null;

/* ---------- Rotas: #pregacoes, #pregacao/<id>, #corte/<id>/<corte>, #configuracoes/<página> ---------- */
function route(h) {
  const [a, b, c] = h.split("/");
  if (a === "configuracoes") { S.screen = "settings"; if (SPAGE[b]) S.spage = b; S.jump = S.spage; return true; }
  S.screen = "editor";
  if (a === "editor") { S.sermonId = 43; S.scriptId = 201; S.level = 3; return true; }
  if (a === "corte" && S.sermons.some(x => x.id === +b && x.scripts.some(r => r.id === +c))) { S.sermonId = +b; S.scriptId = +c; S.level = 3; return true; }
  if (a === "pregacao" && S.sermons.some(x => x.id === +b)) { S.sermonId = +b; S.level = 2; fitSermon(); return true; }
  if (a === "importar") { S.level = 1; S.modal = true; return true; }
  if (a === "pregacoes" || a === "") { S.level = 1; return true; }
  return false;
}
