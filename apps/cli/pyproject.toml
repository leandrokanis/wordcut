[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordcut-cli"
version = "0.1.0"
description = "CLI wordcut: corta pregações e gera cortes verticais."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["wordcut-core"]

[project.scripts]
wordcut = "wordcut_cli:main"
